<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in or create your Noir Brew Co. account to manage orders, subscriptions and favourites."
    />
    <title>Customer Login — Noir Brew Co.</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>☕</text></svg>"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <style>
      /* ── Page-specific layout ── */
      body {
        overflow-x: hidden;
      }

      /* ── SPLIT LAYOUT ── */
      .auth-page {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 100vh;
      }

      /* ── LEFT PANEL ── */
      .auth-left {
        position: relative;
        background: var(--c-bg-alt);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 44px 52px;
        overflow: hidden;
      }
      .auth-left__bg {
        position: absolute;
        inset: 0;
        background: url("https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=1200&q=80")
          center/cover no-repeat;
      }
      .auth-left__over {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(10, 8, 6, 0.93) 0%,
          rgba(10, 8, 6, 0.7) 60%,
          rgba(212, 168, 83, 0.1) 100%
        );
      }
      .auth-left > * {
        position: relative;
        z-index: 2;
      }

      /* Brand header */
      .auth-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .auth-brand__cup {
        width: 44px;
        height: 44px;
        background: var(--c-gold);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 21px;
        animation: float 4s ease-in-out infinite;
      }
      .auth-brand__name {
        font-family: var(--font-display);
        font-style: italic;
        font-size: 1.3rem;
        font-weight: 600;
        color: var(--c-cream);
      }
      .auth-brand__name em {
        color: var(--c-gold);
        font-style: normal;
      }
    </style>
  </head>
  <body></body>
</html>
