<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in or create your Noir Brew Co. account to manage orders, subscriptions and favourites."
    />
    <title>Customer Login — Noir Brew Co.</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>☕</text></svg>"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <style>
      /* ── Page-specific layout ── */
      body {
        overflow-x: hidden;
      }

      /* ── SPLIT LAYOUT ── */
      .auth-page {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 100vh;
      }

      /* ── LEFT PANEL ── */
      .auth-left {
        position: relative;
        background: var(--c-bg-alt);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 44px 52px;
        overflow: hidden;
      }
      .auth-left__bg {
        position: absolute;
        inset: 0;
        background: url("https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=1200&q=80")
          center/cover no-repeat;
      }
      .auth-left__over {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(10, 8, 6, 0.93) 0%,
          rgba(10, 8, 6, 0.7) 60%,
          rgba(212, 168, 83, 0.1) 100%
        );
      }
      .auth-left > * {
        position: relative;
        z-index: 2;
      }

      /* Brand header */
      .auth-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .auth-brand__cup {
        width: 44px;
        height: 44px;
        background: var(--c-gold);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 21px;
        animation: float 4s ease-in-out infinite;
      }
      .auth-brand__name {
        font-family: var(--font-display);
        font-style: italic;
        font-size: 1.3rem;
        font-weight: 600;
        color: var(--c-cream);
      }
      .auth-brand__name em {
        color: var(--c-gold);
        font-style: normal;
      }

      /* Central quote */
      .auth-left__mid {
        text-align: center;
        padding: 0 20px;
      }
      .auth-quote {
        font-family: var(--font-display);
        font-style: italic;
        font-size: clamp(1.4rem, 2.8vw, 2rem);
        font-weight: 400;
        line-height: 1.5;
        color: var(--c-cream);
        margin-bottom: 22px;
      }
      .auth-quote em {
        color: var(--c-gold);
        font-style: normal;
      }

      /* Perks list */
      .auth-perks {
        display: flex;
        flex-direction: column;
        gap: 13px;
      }
      .auth-perk {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        background: rgba(26, 21, 17, 0.72);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(212, 168, 83, 0.14);
        border-radius: var(--r-md);
        transition: all 0.3s var(--ease-out);
        animation: fadeRight 0.6s var(--ease-out) both;
      }
      .auth-perk:hover {
        border-color: rgba(212, 168, 83, 0.35);
        transform: translateX(5px);
      }
      .auth-perk:nth-child(1) {
        animation-delay: 0.1s;
      }
      .auth-perk:nth-child(2) {
        animation-delay: 0.18s;
      }
      .auth-perk:nth-child(3) {
        animation-delay: 0.26s;
      }
      .auth-perk:nth-child(4) {
        animation-delay: 0.34s;
      }
      .auth-perk__icon {
        width: 38px;
        height: 38px;
        flex-shrink: 0;
        background: rgba(212, 168, 83, 0.15);
        border-radius: var(--r-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
      }
      .auth-perk__title {
        font-size: 0.87rem;
        font-weight: 600;
        color: var(--c-cream);
      }
      .auth-perk__sub {
        font-size: 0.74rem;
        color: var(--c-muted);
        margin-top: 2px;
      }

      /* Decorative ring */
      .auth-ring {
        position: absolute;
        border: 1px solid rgba(212, 168, 83, 0.1);
        border-radius: 50%;
        pointer-events: none;
      }

      /* ── RIGHT PANEL ── */
      .auth-right {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 52px;
        background: var(--c-bg);
        position: relative;
        overflow: hidden;
      }
      /* Subtle background pattern */
      .auth-right::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            circle at 20% 80%,
            rgba(212, 168, 83, 0.04) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 20%,
            rgba(212, 168, 83, 0.03) 0%,
            transparent 40%
          );
        pointer-events: none;
      }

      .auth-box {
        width: 100%;
        max-width: 420px;
        position: relative;
        z-index: 1;
      }

      /* Back link */
      .auth-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.83rem;
        color: var(--c-muted);
        margin-bottom: 36px;
        transition: color 0.2s;
      }
      .auth-back:hover {
        color: var(--c-gold);
      }
    </style>
  </head>
  <body></body>
</html>
